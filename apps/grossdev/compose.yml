services:
  grossdev:
    image: "ghcr.io/grossnate/grossdev:${GROSSDEV_VERSION:?Set GROSSDEV_VERSION in the root .env}"
    restart: unless-stopped

    networks:
      - edge

    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1/
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
