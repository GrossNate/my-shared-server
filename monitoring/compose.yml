services:
  alloy:
    extends:
      file: ../compose.defaults.yml
      service: logging-defaults
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      GCLOUD_RW_API_KEY: "${GCLOUD_RW_API_KEY:?Start Compose through dotenvx}"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs.alloy:/etc/alloy/logs.alloy:ro
      - ./caddy.alloy:/etc/alloy/caddy.alloy:ro
      - ./nginx.alloy:/etc/alloy/nginx.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
      - /etc/machine-id:/etc/machine-id:ro

  nginx-exporter:
    extends:
      file: ../compose.defaults.yml
      service: logging-defaults
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://grossdev:8080/stub_status
      - --nginx.scrape-uri=http://requesthole-nginx:8080/stub_status
    depends_on:
      grossdev:
        condition: service_healthy
      requesthole-nginx:
        condition: service_healthy
    expose:
      - "9113"
    networks:
      - edge

volumes:
  alloy_data:
