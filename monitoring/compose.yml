services:
  alloy:
    image: grafana/alloy:v1.21.3
    restart: unless-stopped
    network_mode: host
    pid: host
    environment:
      GCLOUD_RW_API_KEY: "${GCLOUD_RW_API_KEY:?Start Compose through dotenvx}"
    command:
      - run
      - --server.http.listen-addr=127.0.0.1:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - ./logs.alloy:/etc/alloy/logs.alloy:ro
      - alloy_data:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - type: bind
        source: /
        target: /host/root
        read_only: true
        bind:
          propagation: rslave
      - /etc/machine-id:/etc/machine-id:ro

volumes:
  alloy_data:
